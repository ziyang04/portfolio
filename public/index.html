<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0b0d" />
    <meta
      name="description"
      content="Portfolio of PANG Zi Yang, a final-year HKUST Computer Science + AI student and Full-Stack AI Engineer in Hong Kong, featuring experience, projects, and skills."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <!-- Plain-text version of this site for AI crawlers that don't run JavaScript -->
    <link rel="alternate" type="text/markdown" href="%PUBLIC_URL%/llms.txt" title="llms.txt" />

    <!-- Structured profile data, readable without running JavaScript -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "PANG Zi Yang",
        "jobTitle": "Full-Stack AI Engineer",
        "email": "mailto:zypang04@gmail.com",
        "address": { "@type": "PostalAddress", "addressLocality": "Hong Kong" },
        "alumniOf": {
          "@type": "CollegeOrUniversity",
          "name": "The Hong Kong University of Science and Technology"
        },
        "worksFor": { "@type": "Organization", "name": "Zonic Tech", "url": "https://zonic.tech" },
        "knowsAbout": ["Artificial Intelligence", "AI Agents", "Machine Learning", "Full-Stack Development", "Google Cloud Platform", "React", "Next.js", "Python"],
        "sameAs": [
          "https://github.com/ziyang04",
          "https://linkedin.com/in/zi-yang-pang/",
          "https://www.instagram.com/_ziyang04/"
        ]
      }
    </script>
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Static copy of the content for scrapers (injected at build time);
         hidden when JavaScript runs, since React renders the real page -->
    <style>html.js #static-content { display: none; }</style>

    <!-- Apply the saved theme before first paint to avoid a flash -->
    <script>
      (function () {
        document.documentElement.classList.add('js');
        try {
          var t = localStorage.getItem('theme') || 'dark';
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Fraunces is requested with SOFT/WONK pinned, so only the one instance
         needed for the hero name is downloaded. -->
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:SOFT,WONK,opsz,wght@60,1,9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.0/css/all.min.css">

    <title>Zi Yang's Portfolio</title>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
